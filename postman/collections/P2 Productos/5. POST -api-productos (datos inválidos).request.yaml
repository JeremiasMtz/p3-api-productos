$kind: http-request
name: 5. POST /api/productos (datos inválidos)
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"nombre": "", "precio": -1}'
scripts:
  - type: afterResponse
    code: pm.test("Código de estado 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 5000
