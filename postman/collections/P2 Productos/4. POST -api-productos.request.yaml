$kind: http-request
name: 4. POST /api/productos
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"nombre": "Monitor", "precio": 2500, "stock": 5}'
